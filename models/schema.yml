version: 2

sources:
  - name: raw_pc
    database: dbt_cloud_snowflake_db
    schema: raw_pc
    tables:
      - name: account
        columns:
          - name: account_id
            tests: [not_null, unique] # PK check
      - name: policy
        columns:
          - name: policy_id
            tests: [not_null, unique] # PK check
          - name: account_id
            tests:
              - relationships: # FK check to account
                  to: source('raw_pc','account')
                  field: account_id
      - name: claim_payment
        columns:
          - name: payment_id
            tests: [not_null, unique]

models:
  # ----- Staging -----
  - name: stg_account
    columns:
      - name: account_id
        tests: [not_null, unique] # PK governance
      - name: state_code
        tests:
          - not_null

  - name: stg_policy
    columns:
      - name: policy_id
        tests: [not_null, unique] # PK governance
      - name: account_id
        tests:
          - relationships: # FK governance (model-level)
              to: ref('stg_account')
              field: account_id
      - name: policy_status
        tests:
          - accepted_values:
              values: ["ACTIVE", "CANCELLED", "EXPIRED"]

  - name: stg_claim_payment
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: claim_id
        tests:
          - not_null

  # ----- Dimensions / Facts -----
  - name: dim_account
    columns:
      - name: account_sk
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: state_code
        tests:
          - relationships:
              to: ref('state_codes') # seed governance: valid codes
              field: state_code

  - name: dim_policy
    columns:
      - name: policy_sk
        tests: [not_null, unique]
      - name: policy_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - relationships: # FK check dim_policy → dim_account (natural key)
              to: ref('dim_account')
              field: account_id

  - name: fct_claim_payments
    columns:
      - name: payment_id
        tests: [not_null, unique] # PK check
      - name: policy_id
        tests:
          - not_null
          - relationships: # FK check fact → dim_policy
              to: ref('dim_policy')
              field: policy_id
      - name: payment_amount
        tests:
          - not_null

  # ----- SCD2 governance checks -----
  - name: dim_insured_scd2_incremental
    columns:
      - name: insured_scd2_key
        tests: [not_null, unique] # PK
      - name: insured_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]
